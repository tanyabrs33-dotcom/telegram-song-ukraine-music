<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Song Ukraine Top — Telegram</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 174, 255, .22), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(130, 60, 255, .20), transparent 35%),
        #0b0b10;
    }
    .card {
      width: min(440px, 100%);
      text-align: center;
      padding: 42px 24px 34px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(20,20,28,.78);
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(14px);
    }
    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 43px;
      background: linear-gradient(135deg, #168cff, #7a35ff);
      box-shadow: 0 10px 35px rgba(80,90,255,.35);
    }
    h1 { margin: 0; font-size: 28px; }
    .sub {
      margin: 10px 0 28px;
      color: #c9c9d4;
      line-height: 1.5;
      font-size: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 17px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(90deg, #168cff, #5b5cff);
      box-shadow: 0 10px 28px rgba(50,100,255,.28);
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(.98); opacity: .9; }
    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #858594;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🎧</div>
    <h1>Song Ukraine Top</h1>
    <p class="sub">Українська музика • ремікси • новинки<br>Заходь до нашого Telegram-каналу 💙💛</p>

    <a class="btn" href="https://t.me/Song_Ukraine_top">
      🔵 Відкрити Telegram
    </a>

    <div class="note">Натисни кнопку, щоб перейти до каналу</div>
  </main>
</body>
</html>
